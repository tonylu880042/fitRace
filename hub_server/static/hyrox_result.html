<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitRaceStudio - Hyrox 成績</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;800&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b; --surface: #18181b; --border: #27272a; --strong: #3f3f46;
      --text: #fafafa; --muted: #a1a1aa; --accent: #e2ff3b; --amber: #f59e0b; --red: #f43f5e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: "Outfit", "Noto Sans TC", sans-serif; padding: 24px;
           display: grid; place-items: start center; min-height: 100vh; }
    .shell { width: min(760px, 100%); display: grid; gap: 20px; }
    h1 { font-family: "Oswald", sans-serif; font-weight: 800; text-transform: uppercase;
         letter-spacing: 0.08em; color: var(--accent); margin: 0; }
    .panel { border: 2px solid var(--border); background: var(--surface);
             border-radius: 4px; padding: 20px; }
    .panel.done { border-color: var(--accent); }
    .panel.dnf { border-color: var(--red); }
    .name { font-family: "Oswald", sans-serif; font-size: 32px; font-weight: 800; margin: 0; }
    .chip { display: inline-block; font-size: 12px; text-transform: uppercase; font-weight: 700;
            border: 1px solid var(--accent); color: var(--accent); border-radius: 3px;
            padding: 2px 8px; letter-spacing: 0.06em; }
    .chip.dnf { border-color: var(--red); color: var(--red); }
    .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { background: #101012; border: 1px solid var(--strong); border-radius: 4px; padding: 12px; }
    .stat .k { font-family: "Oswald", sans-serif; font-size: 11px; text-transform: uppercase;
               letter-spacing: 0.1em; color: var(--muted); }
    .stat .v { font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700;
               font-variant-numeric: tabular-nums; margin-top: 4px; }
    .stat .v.big { color: var(--accent); font-size: 28px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    th { font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 11px;
         letter-spacing: 0.08em; color: var(--muted); }
    td.mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
    tr.run td:first-child { color: var(--accent); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    button { background: var(--accent); color: #000; border: none; padding: 12px 18px;
             font-family: "Oswald", sans-serif; font-weight: 800; text-transform: uppercase;
             border-radius: 4px; cursor: pointer; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--strong); }
    .muted { color: var(--muted); }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="shell">
    <h1>Hyrox 成績 // RESULT</h1>
    <div id="content"><p class="muted">載入中… (Loading)</p></div>
  </div>

  <script>
    const token = location.pathname.split('/').filter(Boolean).pop();

    function fmt(ms) {
      if (ms == null) return "--";
      const t = Math.max(0, Math.round(ms / 1000));
      const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
      const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
      return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
    }
    const STAGE_ZH = {
      run_1:"跑步 1", ski_erg:"滑雪機", run_2:"跑步 2", sled_push:"推雪橇", run_3:"跑步 3",
      sled_pull:"拉雪橇", run_4:"跑步 4", burpee_broad:"波比跳遠", run_5:"跑步 5", row:"划船機",
      run_6:"跑步 6", farmers_carry:"農夫走路", run_7:"跑步 7", sandbag_lunges:"沙袋弓步",
      run_8:"跑步 8", wall_balls:"牆球"
    };

    function download(name, text, type) {
      const blob = new Blob([text], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      URL.revokeObjectURL(a.href);
    }
    function splitsCsv(r) {
      const rows = [["stage","arrived_ms","work_ms","roxzone_before_ms","split_ms","cumulative_ms","resource"]];
      r.splits.forEach(s => rows.push([s.stage, s.arrived_ms, s.work_ms, s.roxzone_before_ms,
        s.split_ms, s.cumulative_ms, s.resource_id || ""]));
      return rows.map(row => row.join(",")).join("\n");
    }

    function showMessage(container, message) {
      const panel = document.createElement('div');
      panel.className = 'panel';
      const text = document.createElement('p');
      text.className = 'muted';
      text.textContent = message;
      panel.appendChild(text);
      container.replaceChildren(panel);
    }

    function appendStat(container, label, value, big = false) {
      const stat = document.createElement('div');
      stat.className = 'stat';
      const key = document.createElement('div');
      key.className = 'k';
      key.textContent = label;
      const valueEl = document.createElement('div');
      valueEl.className = big ? 'v big' : 'v';
      valueEl.textContent = value;
      stat.append(key, valueEl);
      container.appendChild(stat);
    }

    async function load() {
      const c = document.getElementById('content');
      let r;
      try {
        const res = await fetch(`/api/hyrox/result/${token}`);
        if (res.status === 404) {
          showMessage(c, '尚無成績。請在完賽後再回來查詢。\nNo result yet — check back after the race.');
          return;
        }
        if (!res.ok) {
          showMessage(c, `查詢失敗 (HTTP ${res.status})`);
          return;
        }
        r = await res.json();
      } catch (e) {
        showMessage(c, `網路錯誤: ${e}`);
        return;
      }

      const dnf = r.status === 'dnf';

      const summary = document.createElement('div');
      summary.className = `panel ${dnf ? 'dnf' : 'done'}`;
      const name = document.createElement('h2');
      name.className = 'name';
      name.textContent = r.display_name;
      const division = document.createElement('span');
      division.className = 'chip';
      division.textContent = r.division;
      const status = document.createElement('span');
      status.className = `chip ${dnf ? 'dnf' : ''}`;
      status.textContent = dnf
        ? `DNF 棄賽 @ ${STAGE_ZH[r.dnf_stage] || r.dnf_stage || '--'}`
        : 'FINISHED 完賽';
      const totals = document.createElement('div');
      totals.className = 'totals';
      appendStat(totals, '總時間 Total', fmt(r.total_time_ms), true);
      appendStat(totals, '名次 Rank', r.rank ? `#${r.rank}` : '--');
      appendStat(totals, '跑步 Run', fmt(r.run_total_ms));
      appendStat(totals, '器械 Workout', fmt(r.workout_total_ms));
      appendStat(totals, 'Roxzone 轉場', fmt(r.roxzone_total_ms));
      summary.append(name, division, status, totals);

      const splitsPanel = document.createElement('div');
      splitsPanel.className = 'panel';
      const tableWrap = document.createElement('div');
      tableWrap.className = 'table-wrap';
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headingRow = document.createElement('tr');
      ['站別 Stage', '器械 Work', 'Roxzone', '累計 Cumulative', '資源 Resource'].forEach(label => {
        const heading = document.createElement('th');
        heading.textContent = label;
        headingRow.appendChild(heading);
      });
      thead.appendChild(headingRow);
      const tbody = document.createElement('tbody');
      r.splits.forEach(s => {
        const row = document.createElement('tr');
        row.className = String(s.stage).startsWith('run_') ? 'run' : '';
        const values = [
          STAGE_ZH[s.stage] || s.stage,
          fmt(s.work_ms),
          fmt(s.roxzone_before_ms),
          fmt(s.cumulative_ms),
          s.resource_id || '--',
        ];
        values.forEach((value, index) => {
          const cell = document.createElement('td');
          if (index >= 1 && index <= 3) cell.className = 'mono';
          if (index === 4) cell.className = 'muted';
          cell.textContent = value;
          row.appendChild(cell);
        });
        tbody.appendChild(row);
      });
      table.append(thead, tbody);
      tableWrap.appendChild(table);
      splitsPanel.appendChild(tableWrap);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const csvButton = document.createElement('button');
      csvButton.id = 'dl-csv';
      csvButton.textContent = '下載 CSV';
      const jsonButton = document.createElement('button');
      jsonButton.id = 'dl-json';
      jsonButton.className = 'ghost';
      jsonButton.textContent = '下載 JSON';
      actions.append(csvButton, jsonButton);

      const note = document.createElement('p');
      note.className = 'muted';
      note.style.fontSize = '12px';
      note.textContent = 'Roxzone(轉場時間)已含在總時間內,依官方規則單獨列出。';
      c.replaceChildren(summary, splitsPanel, actions, note);

      document.getElementById('dl-csv').onclick = () => download(`${r.display_name}_splits.csv`, splitsCsv(r), 'text/csv');
      document.getElementById('dl-json').onclick = () => download(`${r.display_name}_result.json`, JSON.stringify(r, null, 2), 'application/json');
    }
    load();
  </script>
</body>
</html>
