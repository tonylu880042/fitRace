<!DOCTYPE html>
<html lang="en-US" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitRace Result</title>
  <meta name="description" content="FitRace Athlete Result">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #0d0e0f;
      --border: #262626;
      --border-strong: #3a3a3a;
      --text: #e3e2e2;
      --muted: #a3a3a3;
      --accent: #e2ff3b;
      --ok: #34d399;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Outfit", "Noto Sans TC", sans-serif;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 32px 24px;
      text-align: center;
    }

    .lang-toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    #language-select {
      min-height: 34px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0 10px;
      font-size: 12px;
    }

    #language-select:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 2px solid var(--accent);
      object-fit: cover;
      background: var(--surface-2);
    }

    .avatar.empty {
      display: none;
    }

    .rank {
      font-family: "Oswald", sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin: 0 0 12px;
      line-height: 1;
    }

    .athlete-name {
      font-family: "Oswald", sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin: 0 0 8px;
      line-height: 1.2;
    }

    .athlete-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .athlete-info .info-row {
      display: none;
    }

    .athlete-info .info-row.visible {
      display: block;
    }

    .race-info {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      margin-bottom: 24px;
    }

    .race-type {
      font-family: "Oswald", sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .race-date {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric {
      text-align: center;
    }

    .metric-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .metric-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .metric-unit {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .error-state,
    .loading-state {
      text-align: center;
      padding: 40px 20px;
    }

    .error-message {
      font-size: 16px;
      color: var(--text);
      margin-bottom: 12px;
    }

    .error-hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .back-button {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      font-family: "Oswald", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .back-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
      }

      .card {
        padding: 24px 16px;
      }

      .metrics-grid {
        grid-template-columns: 1fr;
      }

      .rank {
        font-size: 36px;
      }

      .athlete-name {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-toggle">
      <select id="language-select" onchange="setLang(this.value)"></select>
    </div>

    <div class="card" id="result-card" style="display: none;">
      <img id="athlete-avatar" class="avatar" alt="">

      <div id="rank" class="rank"></div>
      <h1 class="athlete-name" id="athlete-name"></h1>

      <div class="athlete-info">
        <div id="athlete-team" class="info-row"></div>
        <div id="athlete-station" class="info-row"></div>
      </div>

      <div class="race-info">
        <div class="race-type" id="race-type"></div>
        <div class="race-date" id="race-date"></div>
      </div>

      <div class="metrics-grid" id="metrics-grid"></div>
    </div>

    <div class="error-state" id="error-state" style="display: none;">
      <div class="error-message" data-i18n="result.error_title">Result not found</div>
      <div class="error-hint" data-i18n="result.error_hint">The token may have expired or is invalid.</div>
      <button class="back-button" onclick="window.location.href='/'" data-i18n="result.back_button">Back to Dashboard</button>
    </div>

    <div class="loading-state" id="loading-state">
      <div class="error-hint" data-i18n="result.loading">Loading...</div>
    </div>
  </div>

  <script>
    // Race-type / metric axis labels are one shared i18n keyset (race_type.*)
    // used for both the race-type heading and the four metric-grid labels
    // below -- previously this was two separate hardcoded en/zh tables in
    // this file plus a third one in results.html.
    function getBrowserLocale() {
      const saved = localStorage.getItem("fitrace.locale");
      if (saved) return saved;
      const browserLang = navigator.language || navigator.userLanguage;
      if (browserLang) {
        const lower = browserLang.toLowerCase();
        if (lower.startsWith("zh")) return "zh-TW";
        if (lower.startsWith("it")) return "it";
        if (lower.startsWith("fr")) return "fr";
        if (lower.startsWith("de")) return "de-CH";
        if (lower.startsWith("sv")) return "sv";
        if (lower.startsWith("en")) return "en-US";
      }
      return "en-US";
    }

    let currentLocale = getBrowserLocale();
    let messages = {};

    function t(key, params = {}) {
      let value = messages[key] || key;
      Object.entries(params).forEach(([name, replacement]) => {
        value = value.replaceAll(`{${name}}`, String(replacement));
      });
      return value;
    }

    async function loadLocaleList() {
      try {
        const response = await fetch("/api/locales");
        const payload = await response.json();
        const select = document.getElementById("language-select");
        select.innerHTML = (payload.locales || []).map((entry) =>
          `<option value="${escapeHtml(entry.code)}">${escapeHtml(entry.label)}</option>`
        ).join("");
        select.value = currentLocale;
      } catch (error) {
        console.error("Failed to load locale list:", error);
      }
    }

    async function loadLocale(locale = currentLocale) {
      const response = await fetch(`/api/locales/${encodeURIComponent(locale)}?t=${Date.now()}`);
      const payload = await response.json();
      currentLocale = payload.locale || "en-US";
      messages = payload.messages || {};
      localStorage.setItem("fitrace.locale", currentLocale);
      document.documentElement.lang = currentLocale;
      document.documentElement.dataset.lang = currentLocale;
      const select = document.getElementById("language-select");
      if (select) select.value = currentLocale;
      applyTranslations();
    }

    async function setLang(locale) {
      await loadLocale(locale);
      renderResult();
      applyTranslations();
    }

    function applyTranslations() {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
    }

    function escapeHtml(str) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(str || '').replace(/[&<>"']/g, m => map[m]);
    }

    function formatTime(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "--";
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "--";
      return Math.round(value).toLocaleString();
    }

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Race-type heading label. Kept as its own function (rather than an
    // inline lookup inside renderResult) so it can be exercised directly
    // under node with a stubbed t() -- see test_result_pages_i18n.py.
    function getRaceTypeLabel(raceType) {
      const type = String(raceType || "").toLowerCase();
      const key = { distance: "race_type.distance", time: "race_type.time", calories: "race_type.calories", max_power: "race_type.max_power", watts: "race_type.watts" }[type];
      return key ? t(key) : (raceType || "--");
    }

    // Anonymous-finisher name fallback. This is intentionally
    // self-contained (no t()/messages dependency) because it is executed
    // in isolation by tests/unit/hub/test_result_pages_anonymous_display.py
    // with only the function itself extracted -- calling the page-global
    // t() there would throw ReferenceError. lang accepts both the legacy
    // two-letter shorthand (en or zh) the existing tests pass, and the
    // full six-locale codes used elsewhere on this page.
    function athleteDisplayName(athlete, lang) {
      const name = athlete.athlete_name;
      if (typeof name === "string" && name.trim()) {
        return name;
      }
      const stationWord = {
        en: "Station", "en-US": "Station",
        zh: "站位", "zh-TW": "站位",
        "de-CH": "Station",
        fr: "Poste",
        it: "Postazione",
        sv: "Station"
      };
      const athleteWord = {
        en: "Athlete", "en-US": "Athlete",
        zh: "選手", "zh-TW": "選手",
        "de-CH": "Athlet",
        fr: "Athlète",
        it: "Atleta",
        sv: "Idrottare"
      };
      if (athlete.station_number) {
        const word = stationWord[lang] || stationWord.en;
        return `${word} ${athlete.station_number}`;
      }
      return athleteWord[lang] || athleteWord.en;
    }

    function formatDate(epochMs) {
      if (!Number.isFinite(epochMs) || epochMs <= 0) return "--";
      try {
        return new Date(epochMs).toLocaleString(
          document.documentElement.lang || "en-US"
        );
      } catch {
        return "--";
      }
    }

    // Metric-grid label/value cell. labelKey is one of the shared
    // race_type.* i18n keys (see getRaceTypeLabel above) -- t() is only
    // called from here, never from renderResult() directly, because
    // createMetric is the one dependency test_result_pages_anonymous_display.py
    // already stubs out when it executes renderResult() in isolation.
    function createMetric(labelKey, value, unit = "") {
      const html = document.createElement("div");
      html.className = "metric";
      const unitHtml = unit ? '<div class="metric-unit">' + escapeHtml(unit) + '</div>' : "";
      html.innerHTML = `
        <div class="metric-label">${escapeHtml(t(labelKey))}</div>
        <div class="metric-value">${escapeHtml(value)}</div>
        ${unitHtml}
      `;
      return html;
    }

    async function loadResult() {
      const token = getQueryParam("token");
      if (!token) {
        showError();
        return;
      }

      try {
        const response = await fetch(`/api/results/token/${encodeURIComponent(token)}`);
        if (!response.ok) {
          showError();
          return;
        }
        const data = await response.json();
        renderResult(data);
        applyTranslations();
      } catch (error) {
        console.error("Failed to load result:", error);
        showError();
      }
    }

    function showError() {
      document.getElementById("loading-state").style.display = "none";
      document.getElementById("result-card").style.display = "none";
      document.getElementById("error-state").style.display = "block";
    }

    function renderResult(data = null) {
      if (!data) {
        if (window._resultData) {
          data = window._resultData;
        } else {
          return;
        }
      }
      window._resultData = data;

      const loading = document.getElementById("loading-state");
      const card = document.getElementById("result-card");
      const errorState = document.getElementById("error-state");

      if (!data.athlete || !data.race) {
        showError();
        return;
      }

      loading.style.display = "none";
      errorState.style.display = "none";
      card.style.display = "block";

      const athlete = data.athlete;
      const race = data.race;
      const lang = document.documentElement.dataset.lang || "en-US";

      if (athlete.avatar_url) {
        const avatar = document.getElementById("athlete-avatar");
        avatar.classList.remove("empty");
        avatar.src = escapeHtml(athlete.avatar_url);
        avatar.style.display = "block";
      } else {
        document.getElementById("athlete-avatar").style.display = "none";
      }

      const rank = athlete.rank || 0;
      const totalAthletes = data.total_athletes || 0;
      const rankSuffix = totalAthletes ? " / " + totalAthletes : "";
      document.getElementById("rank").textContent = `${rank}${rankSuffix}`;

      document.getElementById("athlete-name").textContent = escapeHtml(athleteDisplayName(athlete, lang));

      // athlete-team / athlete-station use static data-i18n spans for the
      // prefix word rather than calling t() here -- renderResult() must
      // stay callable with only createMetric/getRaceTypeLabel/formatDate
      // stubbed (see test_result_pages_anonymous_display.py), so any
      // label text needing translation is filled in afterwards by the
      // outer applyTranslations() pass, not inline in this function.
      const teamEl = document.getElementById("athlete-team");
      if (athlete.team_name) {
        teamEl.innerHTML = `<span data-i18n="result.team_label">Team</span>: ${escapeHtml(athlete.team_name)}`;
        teamEl.classList.add("visible");
      } else {
        teamEl.innerHTML = "";
        teamEl.classList.remove("visible");
      }

      const stationEl = document.getElementById("athlete-station");
      if (athlete.station_number) {
        stationEl.innerHTML = `<span data-i18n="result.station_label">Station</span> ${escapeHtml(athlete.station_number)}`;
        stationEl.classList.add("visible");
      } else {
        stationEl.innerHTML = "";
        stationEl.classList.remove("visible");
      }

      document.getElementById("race-type").textContent = getRaceTypeLabel(race.race_type);
      document.getElementById("race-date").textContent = formatDate(race.end_time_epoch_ms);

      const metricsGrid = document.getElementById("metrics-grid");
      metricsGrid.innerHTML = "";

      metricsGrid.appendChild(createMetric("race_type.distance", formatNumber(athlete.distance_m), "m"));
      metricsGrid.appendChild(createMetric("race_type.time", formatTime(athlete.finished_time_ms || athlete.elapsed_time_ms), ""));
      metricsGrid.appendChild(createMetric("race_type.calories", formatNumber(athlete.calories), ""));
      metricsGrid.appendChild(createMetric("race_type.max_power", formatNumber(athlete.max_power_watts), "W"));
    }

    // Initialize
    (async function() {
      await loadLocaleList();
      await setLang(currentLocale);
      loadResult();
    })();
  </script>
</body>
</html>
