<!DOCTYPE html>
<html lang="en-US" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitRace Results Wall</title>
  <meta name="description" content="FitRace Results QR Wall">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="/static/vendor/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #0d0e0f;
      --border: #262626;
      --border-strong: #3a3a3a;
      --text: #e3e2e2;
      --muted: #a3a3a3;
      --accent: #e2ff3b;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Outfit", "Noto Sans TC", sans-serif;
      padding: 24px;
    }

    .shell {
      width: min(1400px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header h1 {
      margin: 0;
      font-family: "Oswald", sans-serif;
      font-size: clamp(20px, 2.2vw, 28px);
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header h1 span.accent { color: var(--accent); }

    .header p {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .race-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .meta-label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .meta-value {
      color: var(--text);
      font-weight: 600;
    }

    .back-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-button {
      padding: 8px 16px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      font-family: "Oswald", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .back-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .lang-toggle {
      display: flex;
    }

    #language-select {
      min-height: 38px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0 10px;
      font-size: 12px;
    }

    #language-select:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .athlete-card {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .card-rank {
      font-family: "Oswald", sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .card-name {
      font-family: "Oswald", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
    }

    .card-team {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      margin-bottom: 4px;
    }

    .card-metric {
      border-top: 1px solid var(--border);
      padding-top: 8px;
      font-size: 12px;
    }

    .card-metric-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-metric-value {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .card-qr {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      min-height: 140px;
    }

    .card-qr canvas,
    .card-qr svg {
      max-width: 100%;
      height: auto;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-title {
      font-family: "Oswald", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: var(--text);
    }

    .empty-hint {
      font-size: 14px;
      line-height: 1.5;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-strong);
    }

    .status-dot.updating {
      background: var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 960px) {
      body { padding: 14px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .results-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }

    @media (max-width: 640px) {
      .topbar { gap: 12px; }
      .results-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .athlete-card { padding: 12px; }
      .card-name { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="header">
        <h1><span>FitRace</span> <span class="accent">Studio</span> &middot; <span data-i18n="results.page_title">Results</span></h1>
        <p data-i18n="results.subtitle">QR Wall &middot; Live Leaderboard</p>
      </div>

      <div class="race-meta" id="race-meta" style="display: none;">
        <div class="meta-item">
          <span class="meta-label" data-i18n="race_type.label">Race Type</span>
          <span class="meta-value" id="race-type-display"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label" data-i18n="results.meta_athletes">Athletes</span>
          <span class="meta-value" id="athlete-count-display"></span>
        </div>
        <div class="meta-item" id="update-status" style="display: none;">
          <span class="status-indicator">
            <span class="status-dot updating"></span>
            <span data-i18n="results.updating">Updating</span>
          </span>
        </div>
      </div>

      <div class="back-nav">
        <button type="button" class="back-button" onclick="goToDashboard()" data-i18n="result.back_button">Back to Dashboard</button>
      </div>

      <div class="lang-toggle">
        <select id="language-select" onchange="setLang(this.value)"></select>
      </div>
    </header>

    <main id="results-container">
      <div class="empty-state">
        <div class="empty-title" data-i18n="results.empty_title">No Races Yet</div>
        <div class="empty-hint" data-i18n="results.empty_hint">Results will appear here when a race finishes</div>
      </div>
    </main>
  </div>

  <script>
    // Shared race-type / metric axis labels (race_type.*): result.html and
    // results.html both keyed the same distance/time/calories/max_power/
    // watts wording under three separate hardcoded tables. All three now
    // resolve through getRaceTypeLabel()/getMetricLabel() below, which both
    // read the same locale keys instead of carrying their own copy.
    function getBrowserLocale() {
      const saved = localStorage.getItem("fitrace.locale");
      if (saved) return saved;
      const browserLang = navigator.language || navigator.userLanguage;
      if (browserLang) {
        const lower = browserLang.toLowerCase();
        if (lower.startsWith("zh")) return "zh-TW";
        if (lower.startsWith("it")) return "it";
        if (lower.startsWith("fr")) return "fr";
        if (lower.startsWith("de")) return "de-CH";
        if (lower.startsWith("sv")) return "sv";
        if (lower.startsWith("en")) return "en-US";
      }
      return "en-US";
    }

    let currentLocale = getBrowserLocale();
    let messages = {};

    function t(key, params = {}) {
      let value = messages[key] || key;
      Object.entries(params).forEach(([name, replacement]) => {
        value = value.replaceAll(`{${name}}`, String(replacement));
      });
      return value;
    }

    // The QR wall is where athletes queue up to find their card and scan
    // their own token -- unlike result.html this page must never redirect
    // itself away on a timer, or the next person in the queue would find
    // the dashboard instead of the wall. Manual back navigation only.
    function goToDashboard() {
      window.location.href = "/";
    }

    const state = {
      currentResultId: null,
      pollTimer: null,
      qrCodes: new Map()
    };

    async function loadLocaleList() {
      try {
        const response = await fetch("/api/locales");
        const payload = await response.json();
        const select = document.getElementById("language-select");
        select.innerHTML = (payload.locales || []).map((entry) =>
          `<option value="${escapeHtml(entry.code)}">${escapeHtml(entry.label)}</option>`
        ).join("");
        select.value = currentLocale;
      } catch (error) {
        console.error("Failed to load locale list:", error);
      }
    }

    async function loadLocale(locale = currentLocale) {
      const response = await fetch(`/api/locales/${encodeURIComponent(locale)}?t=${Date.now()}`);
      const payload = await response.json();
      currentLocale = payload.locale || "en-US";
      messages = payload.messages || {};
      localStorage.setItem("fitrace.locale", currentLocale);
      document.documentElement.lang = currentLocale;
      document.documentElement.dataset.lang = currentLocale;
      const select = document.getElementById("language-select");
      if (select) select.value = currentLocale;
      applyTranslations();
    }

    async function setLang(locale) {
      await loadLocale(locale);
      refreshResults();
    }

    function applyTranslations() {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
    }

    function escapeHtml(str) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(str || '').replace(/[&<>"']/g, m => map[m]);
    }

    function getRaceTypeLabel(raceType) {
      const type = String(raceType || "").toLowerCase();
      const key = { distance: "race_type.distance", time: "race_type.time", calories: "race_type.calories", max_power: "race_type.max_power", watts: "race_type.watts" }[type];
      return key ? t(key) : (raceType || "--");
    }

    // Anonymous-finisher name fallback. Self-contained (no t()/messages
    // dependency) because tests/unit/hub/test_result_pages_anonymous_display.py
    // extracts and runs this function alone -- referencing the page-global
    // t() there would throw ReferenceError. lang accepts both the legacy
    // two-letter shorthand (en or zh) the existing tests pass, and the
    // full six-locale codes used elsewhere on this page.
    function athleteDisplayName(athlete, lang) {
      const name = athlete.athlete_name;
      if (typeof name === "string" && name.trim()) {
        return name;
      }
      const stationWord = {
        en: "Station", "en-US": "Station",
        zh: "站位", "zh-TW": "站位",
        "de-CH": "Station",
        fr: "Poste",
        it: "Postazione",
        sv: "Station"
      };
      const athleteWord = {
        en: "Athlete", "en-US": "Athlete",
        zh: "選手", "zh-TW": "選手",
        "de-CH": "Athlet",
        fr: "Athlète",
        it: "Atleta",
        sv: "Idrottare"
      };
      if (athlete.station_number) {
        const word = stationWord[lang] || stationWord.en;
        return `${word} ${athlete.station_number}`;
      }
      return athleteWord[lang] || athleteWord.en;
    }

    function formatMetricValue(athlete, raceType, locale) {
      const type = String(raceType || "").toLowerCase();
      const numberFormat = new Intl.NumberFormat(locale);
      let value = "--";
      let unit = "";

      switch (type) {
        case "distance":
          value = numberFormat.format(Math.round(athlete.distance_m || 0));
          unit = "m";
          break;
        case "time": {
          const ms = athlete.finished_time_ms || athlete.elapsed_time_ms || 0;
          const totalSec = Math.floor(ms / 1000);
          const min = Math.floor(totalSec / 60);
          const sec = totalSec % 60;
          value = `${min}:${String(sec).padStart(2, '0')}`;
          break;
        }
        case "calories":
          value = numberFormat.format(Math.round(athlete.calories || 0));
          unit = "kcal";
          break;
        case "max_power":
        case "watts":
          value = numberFormat.format(Math.round(athlete.max_power_watts || 0));
          unit = "W";
          break;
      }

      return { value, unit };
    }

    function getMetricLabel(raceType) {
      return getRaceTypeLabel(raceType);
    }

    async function fetchLatestRace() {
      try {
        const response = await fetch("/api/results/races?limit=1");
        if (!response.ok) return null;
        const data = await response.json();
        const races = data.races || [];
        return races.length > 0 ? races[0] : null;
      } catch (error) {
        console.error("Failed to fetch latest race:", error);
        return null;
      }
    }

    async function fetchRaceDetail(resultId) {
      try {
        const response = await fetch(`/api/results/races/${encodeURIComponent(resultId)}`);
        if (!response.ok) return null;
        return await response.json();
      } catch (error) {
        console.error("Failed to fetch race detail:", error);
        return null;
      }
    }

    function emptyStateHtml() {
      return '<div class="empty-state">'
        + '<div class="empty-title" data-i18n="results.empty_title">No Races Yet</div>'
        + '<div class="empty-hint" data-i18n="results.empty_hint">Results will appear here when a race finishes</div>'
        + '</div>';
    }

    function renderResults(data) {
      const container = document.getElementById("results-container");

      if (!data || !data.results || data.results.length === 0) {
        container.innerHTML = emptyStateHtml();
        document.getElementById("race-meta").style.display = "none";
        return;
      }

      const race = data;
      const athletes = data.results || [];
      const lang = document.documentElement.dataset.lang || "en-US";

      document.getElementById("race-type-display").textContent = getRaceTypeLabel(race.race_type);
      document.getElementById("athlete-count-display").textContent = new Intl.NumberFormat(lang).format(race.athlete_count || athletes.length);
      document.getElementById("race-meta").style.display = "flex";

      const grid = document.createElement("div");
      grid.className = "results-grid";

      athletes.forEach((athlete) => {
        const card = document.createElement("div");
        card.className = "athlete-card";
        card.id = `athlete-${athlete.token || athlete.station_number}`;

        const { value: metricValue, unit: metricUnit } = formatMetricValue(athlete, race.race_type, lang);
        const metricLabel = getMetricLabel(race.race_type);
        const teamHtml = athlete.team_name ? `<div class="card-team">${escapeHtml(athlete.team_name)}</div>` : "";

        const resultUrl = `${window.location.origin}/static/result.html?token=${encodeURIComponent(athlete.token || "")}`;

        card.innerHTML = `
          <div class="card-header">
            <div class="card-rank">#${new Intl.NumberFormat(lang).format(athlete.rank || 0)}</div>
            <div class="card-name">${escapeHtml(athleteDisplayName(athlete, lang))}</div>
          </div>
          ${teamHtml}
          <div class="card-metric">
            <div class="card-metric-label">${escapeHtml(metricLabel)}</div>
            <div class="card-metric-value">${escapeHtml(metricValue)}${metricUnit ? ' ' + escapeHtml(metricUnit) : ''}</div>
          </div>
          <div class="card-qr" id="qr-${athlete.token || athlete.station_number}"></div>
        `;

        grid.appendChild(card);

        if (athlete.token) {
          const qrContainerId = `qr-${athlete.token}`;
          setTimeout(() => {
            const container = document.getElementById(qrContainerId);
            if (container && container.children.length === 0) {
              try {
                new QRCode(container, {
                  text: resultUrl,
                  width: 128,
                  height: 128,
                  colorDark: "#000000",
                  colorLight: "#ffffff"
                });
              } catch (error) {
                console.error("Failed to generate QR code:", error);
              }
            }
          }, 0);
        }
      });

      container.innerHTML = "";
      container.appendChild(grid);
    }

    async function refreshResults() {
      document.getElementById("update-status").style.display = "flex";

      const race = await fetchLatestRace();
      if (!race) {
        renderResults(null);
        applyTranslations();
        document.getElementById("update-status").style.display = "none";
        scheduleNextRefresh();
        return;
      }

      if (state.currentResultId !== race.result_id) {
        state.currentResultId = race.result_id;
        const detail = await fetchRaceDetail(race.result_id);
        if (detail) {
          renderResults(detail);
          applyTranslations();
        }
      }

      document.getElementById("update-status").style.display = "none";
      scheduleNextRefresh();
    }

    function scheduleNextRefresh() {
      if (state.pollTimer) {
        clearTimeout(state.pollTimer);
      }
      state.pollTimer = setTimeout(refreshResults, 10000);
    }

    // Initialize
    (async function() {
      await loadLocaleList();
      await setLang(currentLocale);
    })();
  </script>
</body>
</html>
